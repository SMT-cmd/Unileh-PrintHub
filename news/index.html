<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latest News - AfriNet Hub</title>
    <meta name="description" content="Stay updated with the latest news, announcements, and school updates from AfriNet Hub and the University of Ilesha.">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/modern.css">
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#0a1f44">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AfriNet Hub">
    <link rel="icon" type="image/png" href="../assets/images/favicon-32.png">
    <link rel="apple-touch-icon" href="../assets/images/apple-touch-icon.png">
</head>
<body class="watermark-bg">

    <header></header>

    <main class="container">
        <section class="page-header">
            <h1>Latest News & Announcements</h1>
            <p>Your one-stop source for platform updates and Unilesa news.</p>
        </section>

        <div id="news-container" class="news-list">
            <div class="loading">Fetching latest updates...</div>
        </div>
    </main>

    <footer></footer>

    <script type="module" src="../assets/js/database.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/app.js"></script>

    <script type="module">
        // --- Safe output helpers ---
        // Anything that comes from the database is untrusted.
        // esc() before putting text in HTML, attrUrl() before putting an address in href/src.
        const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[c]));
        const safeUrl = (v) => {
            if (!v) return '';
            try {
                const u = new URL(String(v), window.location.href);
                return (u.protocol === 'http:' || u.protocol === 'https:') ? u.href : '#';
            } catch (e) {
                return '#';
            }
        };
        const attrUrl = (v) => esc(safeUrl(v));

        document.addEventListener('DOMContentLoaded', () => {
            const checkDeps = setInterval(() => {
                if (window.listenToAnnouncements) {
                    clearInterval(checkDeps);
                    initNewsPage();
                }
            }, 100);
        });

        function initNewsPage() {
            const container = document.getElementById('news-container');
            window.listenToAnnouncements((list) => {
                if (list.length > 0) {
                    container.innerHTML = list.map(item => `
                        <article class="news-item card">
                            <div class="news-date">${esc(new Date(item.timestamp || new Date()).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }))}</div>
                            <h3>${esc(item.message)}</h3>
                            
                            ${item.attachment ? `
                                <div class="news-attachment">
                                    ${item.attachment.type === 'image' ? 
                                        `<img src="${attrUrl(item.attachment.url)}" alt="Announcement Image" style="max-width: 100%; border-radius: 10px; margin: 15px 0;">` : 
                                        `<div class="file-link">
                                            <a href="${attrUrl(item.attachment.url)}" target="_blank" rel="noopener noreferrer" class="cta-button-small">
                                                Download Attachment (${esc(item.attachment.filename)})
                                            </a>
                                        </div>`
                                    }
                                </div>
                            ` : ''}

                            <div class="news-actions">
                                ${item.link ? `<a href="${attrUrl(item.link)}" class="cta-button-small" target="_blank" rel="noopener noreferrer">External Link</a>` : ''}
                            </div>
                        </article>
                    `).join('');
                } else {
                    container.innerHTML = `
                        <div class="empty-state">
                            <p>No active announcements at the moment. Check back later!</p>
                        </div>
                    `;
                }
            });
        }
    </script>
</body>
</html>
